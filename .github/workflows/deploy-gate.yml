name: Deploy gate

# Local patch layer (group `local-deploy`): the release gate `tools/deploy-vt.sh` waits for. Production is one Linux
# container built from python:3.11-slim (Dockerfile.local), so the gate runs exactly that: the Python 3.11 suite on
# Linux and the frontend build/tests. Upstream's "CI" (test.yml: Windows/macOS desktop, hash locks on three platforms,
# Python 3.14) stays untouched and keeps running on main; it no longer blocks a deploy. Runs on every branch push so a
# deploy branch gets its verdict without a manual dispatch. Steps mirror test.yml's `test` and `frontend` jobs.

on:
  push:
  workflow_dispatch:

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

jobs:
  test:
    name: test / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,openbb,stats,anthropic]"

      - name: Verify optional extras under test are importable
        run: |
          python -c "import openbb_ai, importlib.metadata as m; print('openbb-ai', m.version('openbb-ai'))"
          python -c "import statsmodels; print('statsmodels', statsmodels.__version__)"
          python -c "import arch; print('arch', arch.__version__)"
          python -c "import langchain_anthropic; print('langchain-anthropic', langchain_anthropic.__version__)"

      - name: Repository safety gates
        run: bash tools/ci_grep_gates.sh

      - name: Test environment variable gate
        run: pytest tools/test_ci_env_var_gate.py -q

      - name: Syntax check
        run: |
          cd agent
          python -m compileall -q cli
          python -m py_compile api_server.py
          python -m py_compile mcp_server.py
          python -m py_compile src/agent/loop.py
          python -m py_compile src/tools/__init__.py
          python -m py_compile backtest/runner.py

      - name: Run tests
        run: pytest --ignore=agent/tests/e2e_backtest --ignore=agent/tests/test_e2e_harness_v2.py --tb=short -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Frontend tests
        run: |
          cd frontend
          npx vitest run --reporter=verbose
