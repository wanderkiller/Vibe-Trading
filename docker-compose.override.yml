# Deployment override maintained by this fork alongside Dockerfile.local and
# requirements-local-providers-lock.txt. Preserve it when merging upstream.
services:
  vibe-trading:
    build:
      context: .
      # Dockerfile.local follows the upstream Dockerfile and installs the
      # hash-pinned requirements-local-providers-lock.txt overlay (Anthropic
      # and DeepSeek). Regenerate it when the upstream Dockerfile changes.
      dockerfile: Dockerfile.local
    # Host networking so cloudflared (a host process at 127.0.0.1:8899) sees
    # the app's real loopback peer identity, matching bare-metal behavior.
    # Bridge NAT would present the container with the bridge gateway IP
    # instead of 127.0.0.1, which falls outside uvicorn's default
    # trusted-proxy IP list and breaks X-Forwarded-Proto handling for
    # non-GET requests.
    # Run an init as PID 1: a grandchild of the alphakeel_research tool whose process group was killed on timeout
    # (killpg) is reparented to it and reaped instead of lingering as a zombie.
    init: true
    network_mode: host
    ports: !reset []
    command: ["vibe-trading", "serve", "--host", "127.0.0.1", "--port", "8899"]
    # Hand-off directory to AlphaKeel (docs/45 section 7): the "Hand off to AlphaKeel" button on the run page exports an IR
    # package to /home/vibe/handoff/<strategy_id>/; AlphaKeel's console on the host reads /home/ubuntu/handoff read-only.
    # Create the host directory before the first start, owned by the container user and setgid so both sides can read:
    #   install -d -o 1000 -g 1001 -m 2775 /home/ubuntu/handoff
    volumes:
      - /home/ubuntu/handoff:/home/vibe/handoff
    environment:
      ALPHAKEEL_HANDOFF_DIR: /home/vibe/handoff
      ALPHAKEEL_HANDOFF_HOST_DIR: /home/ubuntu/handoff
